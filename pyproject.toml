[project]
name = "youtube-downloader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "celery-types>=0.26.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "starlette>=1.4.1",
    "uvicorn>=0.52.1",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
